<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b64">
<title>Deudores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b64; --paper:#fbfcff; --grid:#e3e8f7; --margin:#d64545;
  --text:#1a1f36; --muted:#5d6588; --loan:#c0392b; --pay:#1f7a4d;
  --line:#d5dbef; --surface:#ffffff; --soft:#eef1fb;
  --font-d:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-b:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#9fb2ff; --paper:#11152a; --grid:#1b2140; --margin:#e06666;
    --text:#e8ebf7; --muted:#9aa3c7; --loan:#f07b6c; --pay:#5cc994;
    --line:#2a3156; --surface:#171c36; --soft:#1e2444;
  }
}
:root[data-theme="dark"]{
  --ink:#9fb2ff; --paper:#11152a; --grid:#1b2140; --margin:#e06666;
  --text:#e8ebf7; --muted:#9aa3c7; --loan:#f07b6c; --pay:#5cc994;
  --line:#2a3156; --surface:#171c36; --soft:#1e2444;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--text);
  font-family:var(--font-b);font-size:16px;line-height:1.45;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px;position:relative}
.wrap::before{ /* margen rojo de cuaderno */
  content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin);opacity:.55;pointer-events:none
}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Encabezado */
header{padding:28px 0 18px 32px}
header h1{font-family:var(--font-d);font-weight:700;font-size:1.05rem;margin:0;color:var(--muted)}
.total{font-family:var(--font-d);font-weight:800;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;color:var(--ink);margin:6px 0 6px;letter-spacing:-.02em;word-break:break-all}
.sub{color:var(--muted);margin:0;font-size:.95rem}

/* Lista */
.list{margin-top:10px;border-top:2px solid var(--ink)}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:16px 4px 16px 32px;color:inherit;
}
.row:active{background:var(--soft)}
.row .who{flex:1;min-width:0}
.row .name{font-weight:600;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--muted);font-size:.85rem}
.row .bal{font-family:var(--font-d);font-weight:700;font-size:1.2rem;color:var(--loan)}
.row.paid .bal{color:var(--pay)}
.row .right{text-align:right;flex:none}
.row .pct{font-size:.8rem;color:var(--muted);margin-top:1px}
.row.paid .name{color:var(--muted)}
.empty{padding:40px 8px 0 32px;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:1.1rem;margin-bottom:4px}
.section-label{padding:22px 0 6px 32px;color:var(--muted);font-size:.9rem;font-weight:600}

/* Botón flotante */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);border:0;border-radius:999px;
  padding:15px 26px;font-weight:600;font-size:1rem;box-shadow:0 6px 18px rgba(29,43,100,.3)
}

/* Hojas (detalle y formularios) */
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(10,14,35,.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  background:var(--surface);border-radius:20px 20px 0 0;
  max-height:92%;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
  animation:up .22s ease-out;
}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 6px}
.sheet-head h2{flex:1;margin:0;font-family:var(--font-d);font-weight:700;font-size:1.4rem;line-height:1.2;word-break:break-word}
.x{background:var(--soft);border:0;border-radius:999px;width:36px;height:36px;color:var(--text);font-size:1.2rem;line-height:1;flex:none}
.sheet-body{overflow-y:auto;padding:4px 20px 22px}

.saldo{font-family:var(--font-d);font-weight:800;font-size:2.4rem;color:var(--loan);line-height:1.05;margin:4px 0 2px}
.saldo.zero{color:var(--pay)}
.saldo-note{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn{border:0;border-radius:12px;padding:14px 12px;font-weight:600;font-size:1rem}
.btn.pay{background:var(--pay);color:#fff}
.btn.loan{background:var(--loan);color:#fff}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.wide{width:100%}

.hist-title{font-weight:600;margin:0 0 6px;color:var(--muted);font-size:.9rem}
.mov{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.mov .kind{font-weight:600}
.mov .amt{font-weight:600;text-align:right}
.mov.pay .amt{color:var(--pay)}
.mov.loan .amt{color:var(--loan)}
.mov .when{color:var(--muted);font-size:.85rem}
.mov .run{color:var(--muted);font-size:.85rem;text-align:right}
.mov .note{grid-column:1 / -1;color:var(--muted);font-size:.9rem;font-style:italic}
.mov .ops{grid-column:1 / -1;display:flex;gap:20px}
.mov .ops button{background:none;border:0;color:var(--muted);font-size:.88rem;padding:6px 0;text-decoration:underline}
.mov .ops .edit{color:var(--ink);font-weight:600}
.danger-link{background:none;border:0;color:var(--loan);padding:18px 0 0;font-size:.9rem;text-decoration:underline}

/* Gráfico */
.chart{margin:0 0 22px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--font-b);font-size:10px}
.chart .bar{fill:var(--pay)}
.chart .saldo-line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.chart .dot{fill:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .lp{background:var(--pay)}
.legend .ls{background:var(--ink);height:3px;vertical-align:3px}
.chart-sum{margin:8px 0 0;font-size:.92rem}
.chart-empty{color:var(--muted);font-size:.92rem;margin:0 0 22px;padding:14px;background:var(--soft);border-radius:10px}

/* Informe */
.rep{color:var(--text)}
.rep h3{font-family:var(--font-d);font-weight:700;font-size:1.35rem;margin:0 0 2px;line-height:1.2}
.rep .issued{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.rep-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.rep-tot div{background:var(--soft);border-radius:10px;padding:10px}
.rep-tot span{display:block;font-size:.78rem;color:var(--muted)}
.rep-tot b{font-family:var(--font-d);font-size:1.02rem}
.rep-tot .owe b{color:var(--loan)}
.rep-scroll{overflow-x:auto}
.rep table{width:100%;border-collapse:collapse;font-size:.88rem}
.rep th{text-align:left;color:var(--muted);font-weight:600;padding:6px 6px 6px 0;border-bottom:2px solid var(--ink)}
.rep td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rep .r{text-align:right;white-space:nowrap}
.rep td.pay{color:var(--pay)}
.rep td.loan{color:var(--loan)}
.rep .n{display:block;color:var(--muted);font-size:.82rem;font-style:italic}
.rep .foot{color:var(--muted);font-size:.85rem;margin:14px 0 0}
.rep-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
#printArea{display:none}
@media print{
  @page{margin:16mm}
  body{background:none !important}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important;color:#000}
  #printArea .rep{--text:#000;--muted:#555;--ink:#1d2b64;--line:#ccc;--soft:#f1f3f9;--pay:#1f7a4d;--loan:#c0392b}
  #printArea .rep-tot div{border:1px solid #ccc}
}

/* Formulario */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input{
  width:100%;font:inherit;font-size:1.05rem;color:var(--text);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:12px;
}
.field input.big{font-family:var(--font-d);font-weight:700;font-size:1.6rem}
.err{color:var(--loan);font-size:.9rem;min-height:1.2em;margin:-4px 0 10px}
.status{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.status.show{opacity:1}
.credit{text-align:center;color:var(--muted);font-size:.8rem;margin:28px 0 0;padding:16px 0 0 32px;border-top:1px solid var(--line);line-height:1.7}
.credit b{color:var(--ink)}
.credit a{color:inherit;text-decoration:none}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Me deben en total</h1>
    <div class="total num" id="total">$0</div>
    <p class="sub" id="summary">Cargando…</p>
  </header>
  <div id="list"></div>
  <footer class="credit">Diseñado por <b>BG Solutions</b><br><a href="tel:+56955374077">📞 +56 9 5537 4077</a><br><a href="tel:+56957220849">📞 +56 9 5722 0849</a><br><a href="https://bgiasolutions.cl/" target="_blank" rel="noopener">🌐 bgiasolutions.cl</a></footer>
</div>

<button class="fab" id="newBtn" type="button">+ Nuevo préstamo</button>
<div class="status" id="status" role="status" aria-live="polite"></div>

<!-- Detalle de la persona -->
<dialog id="detail">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="dName"></h2>
      <button class="x" type="button" data-close aria-label="Cerrar">×</button>
    </div>
    <div class="sheet-body">
      <div class="saldo num" id="dSaldo"></div>
      <p class="saldo-note" id="dNote"></p>
      <div class="actions">
        <button class="btn pay" type="button" id="dPay">Registrar abono</button>
        <button class="btn loan" type="button" id="dLoan">Prestar más</button>
      </div>
      <button class="btn ghost wide" type="button" id="dReport" style="margin:-10px 0 22px">Generar informe de pago</button>
      <p class="hist-title">Pagos en el tiempo</p>
      <div id="dChart"></div>
      <p class="hist-title">Historial</p>
      <div id="dHist"></div>
      <button class="danger-link" type="button" id="dDelete">Eliminar a esta persona</button>
    </div>
  </div>
</dialog>

<!-- Formulario de movimiento / nueva persona -->
<dialog id="form">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="fTitle"></h2>
      <button class="x" type="button" data-close aria-label="Cerrar">×</button>
    </div>
    <div class="sheet-body">
      <label class="field" id="fNameWrap"><span>Nombre</span>
        <input id="fName" autocomplete="off" autocapitalize="words" maxlength="60">
      </label>
      <label class="field"><span>Monto</span>
        <input id="fAmount" class="big num" inputmode="numeric" autocomplete="off" placeholder="$0">
      </label>

        <input id="fDate" type="date">

      <label class="field"><span>Nota (opcional)</span>

      <button class="btn primary wide" type="button" id="fSave">Guardar</button>

<!-- Informe de pago -->
<dialog id="report">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Informe de pago</h2>
      <button class="x" type="button" data-close aria-label="Cerrar">×</button>
    </div>
    <div class="sheet-body">
      <div id="rBody"></div>
      <div class="rep-actions">
        <button class="btn primary" type="button" id="rPrint">Descargar PDF</button>
        <button class="btn ghost" type="button" id="rShare">Compartir como texto</button>
      </div>
    </div>
  </div>
</dialog>
<div id="printArea"></div>

<script>
(function(){
  "use strict";
  // ---------- Formato ----------
  var fmt = new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0});
  function money(n){ return fmt.format(Math.round(n||0)); }
  function digits(s){ return parseInt(String(s).replace(/\D/g,""),10) || 0; }
  function today(){
    var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }
  function niceDate(iso){
    if(!iso) return "";
    var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
    return d.toLocaleDateString("es-CL",{day:"numeric",month:"short",year:"numeric"});
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function balance(p){
    return (p.movs||[]).reduce(function(s,m){ return s + (m.type==="abono" ? -m.amount : m.amount); },0);
  }
  function sortedMovs(p){
    return (p.movs||[]).slice().sort(function(a,b){
      return a.date===b.date ? (a.ts||0)-(b.ts||0) : (a.date<b.date?-1:1);
    });
  }

  // ---------- Almacenamiento (Claude db o localStorage) ----------
  var people = {};          // id -> persona
  var store = null;         // {save(p), remove(id)}
  var LS_KEY = "deudores-v1";

  function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}; }catch(e){ return {}; } }
  function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(people)); }catch(e){} }

  var localStore = {
    save:function(p){ people[p.id]=p; lsWrite(); render(); return Promise.resolve(); },
    remove:function(id){ delete people[id]; lsWrite(); render(); return Promise.resolve(); }
  };

  function useLocal(){
    store = localStore;
    people = lsRead();
    render();
  }

  var queues = {};
  function queued(id, fn){
    var prev = queues[id] || Promise.resolve();
    var next = prev.catch(function(){}).then(fn);
    queues[id] = next;
    return next;
  }

  function useDb(db, userId){
    var col = db.collection("data/users/"+userId);
    store = {
      save:function(p){
        people[p.id]=p; render();
        return queued(p.id, function(){ return col.doc(p.id).set(JSON.parse(JSON.stringify(p))); })
          .catch(function(e){ flash(e && e.code==="quota_exceeded" ? "No hay espacio para guardar más datos" : "No se pudo guardar. Revisa tu conexión."); });
      },
      remove:function(id){
        delete people[id]; render();
        return queued(id, function(){ return col.doc(id).delete(); })
          .catch(function(){ flash("No se pudo eliminar. Revisa tu conexión."); });
      }
    };
    col.onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(d){ var v=d.data(); if(v) next[d.id]=JSON.parse(JSON.stringify(v)); });
      people = next; render(); refreshOpenDetail();
    }, function(){ flash("Se perdió la conexión con los datos"); });
  }

  function init(){
    render();
    if(!window.claude || typeof window.claude.use!=="function"){ useLocal(); return; }
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
      var db=r[0], user=r[1];
      if(!db || !user){ useLocal(); return; }
      return user.id().then(function(id){ if(id) useDb(db,id); else useLocal(); });
    }).catch(useLocal);
  }

  // ---------- Vista principal ----------
  var $ = function(id){ return document.getElementById(id); };
  var loaded = false;
  var totalLent = 0;
  var pctFmt = new Intl.NumberFormat("es-CL",{maximumFractionDigits:1});

  function render(){
    var list = Object.keys(people).map(function(k){ return people[k]; });
    var owing = list.filter(function(p){ return balance(p)>0; })
                    .sort(function(a,b){ return balance(b)-balance(a); });
    var paid = list.filter(function(p){ return balance(p)<=0; })
                   .sort(function(a,b){ return a.name.localeCompare(b.name,"es"); });
    var total = owing.reduce(function(s,p){ return s+balance(p); },0);
    totalLent = list.reduce(function(s,p){
      return s + (p.movs||[]).reduce(function(a,m){ return a + (m.type==="abono" ? 0 : m.amount); },0);
    },0);
    $("total").textContent = money(total);
    if(store) loaded = true;
    $("summary").textContent = !loaded ? "Cargando…" :
      owing.length===0 ? "Nadie te debe por ahora" :
      owing.length===1 ? "1 persona con saldo pendiente" :
      owing.length+" personas con saldo pendiente";

    var box = $("list"); box.textContent = "";
    if(loaded && list.length===0){
      var e=document.createElement("div"); e.className="empty";
      var s=document.createElement("strong"); s.textContent="Aún no hay préstamos anotados";
      e.appendChild(s); e.appendChild(document.createTextNode("Toca “Nuevo préstamo” para anotar a quién le prestaste y cuánto."));
      box.appendChild(e); return;
    }
    var l1=document.createElement("div"); l1.className="list";
    owing.forEach(function(p){ l1.appendChild(rowFor(p,false)); });
    if(owing.length) box.appendChild(l1);
    if(paid.length){
      var lab=document.createElement("div"); lab.className="section-label"; lab.textContent="Al día";
      box.appendChild(lab);
      var l2=document.createElement("div"); l2.className="list";
      paid.forEach(function(p){ l2.appendChild(rowFor(p,true)); });
      box.appendChild(l2);
    }
  }

  function rowFor(p, isPaid){
    var b=document.createElement("button"); b.type="button"; b.className="row"+(isPaid?" paid":"");
    var who=document.createElement("div"); who.className="who";
    var n=document.createElement("div"); n.className="name"; n.textContent=p.name;
    var m=document.createElement("div"); m.className="meta";
    var ms=sortedMovs(p); var last=ms[ms.length-1];
    m.textContent = last ? "Último movimiento: "+niceDate(last.date) : "";
    who.appendChild(n); who.appendChild(m);
    var right=document.createElement("div"); right.className="right";
    var bal=document.createElement("div"); bal.className="bal num";
    bal.textContent = isPaid ? "Pagado" : money(balance(p));
    right.appendChild(bal);
    if(!isPaid && totalLent>0){
      var pc=document.createElement("div"); pc.className="pct num";
      pc.textContent = pctFmt.format(balance(p)/totalLent*100)+"% del total prestado";
      right.appendChild(pc);
    }
    b.appendChild(who); b.appendChild(right);
    b.addEventListener("click", function(){ openDetail(p.id); });
    return b;
  }

  // ---------- Detalle ----------
  var currentId = null;
  function openDetail(id){ currentId=id; fillDetail(); $("detail").showModal(); }
  function refreshOpenDetail(){
    if(!$("detail").open) return;
    if(!people[currentId]){ $("detail").close(); return; }
    fillDetail();
  }
  function fillDetail(){
    var p=people[currentId]; if(!p) return;
    var bal=balance(p);
    $("dName").textContent=p.name;
    $("dSaldo").textContent= bal>0 ? money(bal) : "Pagado";
    $("dSaldo").className="saldo num"+(bal>0?"":" zero");
    var ms=sortedMovs(p);
    var lent=ms.filter(function(m){return m.type!=="abono";}).reduce(function(s,m){return s+m.amount;},0);
    var paid=ms.filter(function(m){return m.type==="abono";}).reduce(function(s,m){return s+m.amount;},0);
    $("dNote").textContent = bal>0 ? "Saldo pendiente · prestado "+money(lent)+", abonado "+money(paid)
                                   : "Prestado "+money(lent)+", abonado "+money(paid);
    drawChart(ms);
    var h=$("dHist"); h.textContent="";
    var run=0; var rows=[];
    ms.forEach(function(m){
      run += m.type==="abono" ? -m.amount : m.amount;
      rows.push({m:m, run:run});
    });
    rows.reverse().forEach(function(r){
      var m=r.m, isPay=m.type==="abono";
      var d=document.createElement("div"); d.className="mov "+(isPay?"pay":"loan");
      var k=document.createElement("div"); k.className="kind";
      k.textContent = isPay ? "Abono" : (m.first ? "Préstamo inicial" : "Préstamo");
      var a=document.createElement("div"); a.className="amt num"; a.textContent=(isPay?"− ":"+ ")+money(m.amount);
      var w=document.createElement("div"); w.className="when"; w.textContent=niceDate(m.date);
      var rr=document.createElement("div"); rr.className="run num"; rr.textContent="Saldo "+money(Math.max(r.run,0));
      d.appendChild(k); d.appendChild(a); d.appendChild(w); d.appendChild(rr);
      if(m.note){ var n=document.createElement("div"); n.className="note"; n.textContent=m.note; d.appendChild(n); }
      var ops=document.createElement("div"); ops.className="ops";
      var ed=document.createElement("button"); ed.type="button"; ed.className="edit"; ed.textContent="Editar";
      ed.addEventListener("click", function(){ openForm(m.type==="abono"?"abono":"prestamo", m); });
      var del=document.createElement("button"); del.type="button"; del.textContent="Borrar";
      del.addEventListener("click", function(){ deleteMov(m.id); });
      var pdf=document.createElement("button"); pdf.type="button"; pdf.textContent="Comprobante PDF";
      pdf.addEventListener("click", function(){ pdfReceipt(people[currentId], m); });
      ops.appendChild(ed); ops.appendChild(pdf); ops.appendChild(del);
      d.appendChild(ops);
      h.appendChild(d);
    });
  }
  function compact(n){
    if(n>=1e6) return "$"+(n/1e6).toLocaleString("es-CL",{maximumFractionDigits:1})+" M";
    if(n>=1e3) return "$"+Math.round(n/1e3).toLocaleString("es-CL")+" mil";
    return "$"+Math.round(n);
  }
  function toT(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).getTime(); }
  function shortDate(t){ return new Date(t).toLocaleDateString("es-CL",{day:"numeric",month:"short",year:"2-digit"}); }

  function drawChart(ms){
    var box=$("dChart"); box.textContent="";
    var abonos=ms.filter(function(m){ return m.type==="abono"; });
    if(!abonos.length){
      var e=document.createElement("p"); e.className="chart-empty";
      e.textContent="Cuando registres abonos verás aquí el gráfico de pagos.";
      box.appendChild(e); return;
    }
    var DAY=86400000;
    var t0=toT(ms[0].date), t1=Math.max(toT(ms[ms.length-1].date), toT(today()));
    if(t1-t0<DAY*2){ t0-=DAY; t1+=DAY; }
    // saldo después de cada fecha
    var run=0, byDay={}, order=[];
    ms.forEach(function(m){
      run+= m.type==="abono" ? -m.amount : m.amount;
      if(!(m.date in byDay)) order.push(m.date);
      byDay[m.date]=Math.max(run,0);
    });
    var pts=order.map(function(d){ return [toT(d), byDay[d]]; });
    var payDay={};
    abonos.forEach(function(m){ payDay[m.date]=(payDay[m.date]||0)+m.amount; });
    var maxY=1;
    pts.forEach(function(p){ if(p[1]>maxY) maxY=p[1]; });
    Object.keys(payDay).forEach(function(d){ if(payDay[d]>maxY) maxY=payDay[d]; });
    var W=340,H=180,L=50,R=10,T=12,B=26;
    function x(t){ return L+(t-t0)/(t1-t0)*(W-L-R); }
    function y(v){ return T+(1-v/maxY)*(H-T-B); }
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de abonos y saldo en el tiempo">';
    [0,0.5,1].forEach(function(f){
      var yy=y(maxY*f).toFixed(1);
      s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/>';
      s+='<text class="ax" x="'+(L-6)+'" y="'+yy+'" dy="3" text-anchor="end">'+compact(maxY*f)+'</text>';
    });
    Object.keys(payDay).forEach(function(d){
      var cx=x(toT(d)), top=y(payDay[d]), h=Math.max(y(0)-top,1.5);
      s+='<rect class="bar" rx="2" x="'+(cx-4).toFixed(1)+'" y="'+top.toFixed(1)+'" width="8" height="'+h.toFixed(1)+'"/>';
    });
    var path='M'+x(pts[0][0]).toFixed(1)+' '+y(pts[0][1]).toFixed(1);
    for(var i=1;i<pts.length;i++){ path+=' H'+x(pts[i][0]).toFixed(1)+' V'+y(pts[i][1]).toFixed(1); }
    path+=' H'+x(t1).toFixed(1);
    s+='<path class="saldo-line" d="'+path+'"/>';
    var last=pts[pts.length-1];
    s+='<circle class="dot" r="3.5" cx="'+x(t1).toFixed(1)+'" cy="'+y(last[1]).toFixed(1)+'"/>';
    s+='<text class="ax" x="'+L+'" y="'+(H-6)+'">'+shortDate(t0)+'</text>';
    s+='<text class="ax" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+shortDate(t1)+'</text>';
    s+='</svg>';
    var wrap=document.createElement("div"); wrap.className="chart";
    wrap.innerHTML=s;
    var lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML='<span><i class="lp"></i>Abonos</span><span><i class="ls"></i>Saldo pendiente</span>';
    wrap.appendChild(lg);
    var total=abonos.reduce(function(a,m){ return a+m.amount; },0);
    var lastPay=abonos[abonos.length-1];
    var days=Math.round((toT(today())-toT(lastPay.date))/DAY);
    var sum=document.createElement("p"); sum.className="chart-sum";
    sum.textContent=(abonos.length===1?"1 abono":abonos.length+" abonos")+" por "+money(total)+". Último pago "+
      (days<=0?"hoy":days===1?"ayer":"hace "+days+" días")+".";
    wrap.appendChild(sum);
    box.appendChild(wrap);
  }

  function deleteMov(movId){
    var p=people[currentId]; if(!p) return;
    if(!confirm("¿Borrar este movimiento? El saldo se recalculará.")) return;
    var copy=JSON.parse(JSON.stringify(p));
    copy.movs=copy.movs.filter(function(m){ return m.id!==movId; });
    store.save(copy); fillDetail();
  }
  $("dDelete").addEventListener("click", function(){
    var p=people[currentId]; if(!p) return;
    if(!confirm("¿Eliminar a "+p.name+" y todo su historial? No se puede deshacer.")) return;
    $("detail").close(); store.remove(p.id); flash("Eliminado");
  });
  $("dPay").addEventListener("click", function(){ openForm("abono"); });
  $("dLoan").addEventListener("click", function(){ openForm("prestamo"); });

  // ---------- Informe de pago ----------
  function el(tag, cls, text){
    var e=document.createElement(tag); if(cls) e.className=cls;
    if(text!=null) e.textContent=text; return e;
  }
  function totals(p){
    var ms=sortedMovs(p), lent=0, paid=0;
    ms.forEach(function(m){ if(m.type==="abono") paid+=m.amount; else lent+=m.amount; });
    return {ms:ms, lent:lent, paid:paid, bal:Math.max(lent-paid,0)};
  }
  function buildReport(p){
    var t=totals(p);
    var r=el("div","rep");
    r.appendChild(el("h3",null,"Estado de cuenta de "+p.name));
    r.appendChild(el("p","issued","Emitido el "+niceDate(today())));
    var tot=el("div","rep-tot");
    [["Total prestado",t.lent,""],["Total abonado",t.paid,""],["Saldo pendiente",t.bal,"owe"]].forEach(function(c){
      var d=el("div",c[2]); d.appendChild(el("span",null,c[0])); d.appendChild(el("b","num",money(c[1]))); tot.appendChild(d);
    });
    r.appendChild(tot);
    var sc=el("div","rep-scroll"), tb=el("table","num");
    var hr=el("tr"); ["Fecha","Detalle","Monto","Saldo"].forEach(function(h,i){ hr.appendChild(el("th",i>1?"r":null,h)); });
    var thead=el("thead"); thead.appendChild(hr); tb.appendChild(thead);
    var tbody=el("tbody"), run=0;
    t.ms.forEach(function(m){
      var isPay=m.type==="abono";
      run+= isPay ? -m.amount : m.amount;
      var tr=el("tr");
      tr.appendChild(el("td",null,niceDate(m.date)));
      var det=el("td",null,isPay?"Abono":(m.first?"Préstamo inicial":"Préstamo"));
      if(m.note) det.appendChild(el("span","n",m.note));
      tr.appendChild(det);
      tr.appendChild(el("td","r "+(isPay?"pay":"loan"),(isPay?"− ":"+ ")+money(m.amount)));
      tr.appendChild(el("td","r",money(Math.max(run,0))));
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody); sc.appendChild(tb); r.appendChild(sc);
    var pays=t.ms.filter(function(m){ return m.type==="abono"; });
    r.appendChild(el("p","foot", pays.length
      ? pays.length+(pays.length===1?" abono registrado. Último abono el ":" abonos registrados. Último abono el ")+niceDate(pays[pays.length-1].date)+"."
      : "Aún no hay abonos registrados."));
    return r;
  }
  function reportText(p){
    var t=totals(p), run=0;
    var lines=["Estado de cuenta de "+p.name, "Emitido el "+niceDate(today()), "",
      "Total prestado: "+money(t.lent), "Total abonado: "+money(t.paid), "Saldo pendiente: "+money(t.bal), "", "Movimientos:"];
    t.ms.forEach(function(m){
      var isPay=m.type==="abono"; run+= isPay ? -m.amount : m.amount;
      lines.push("• "+niceDate(m.date)+" – "+(isPay?"Abono":"Préstamo")+" "+(isPay?"−":"+")+money(m.amount)+
        (m.note?" ("+m.note+")":"")+" → saldo "+money(Math.max(run,0)));
    });
    return lines.join("\n");
  }
  $("dReport").addEventListener("click", function(){
    var p=people[currentId]; if(!p) return;
    var b=$("rBody"); b.textContent=""; b.appendChild(buildReport(p));
    $("report").showModal();
  });
  $("rPrint").addEventListener("click", function(){
    var p=people[currentId]; if(p) pdfReport(p);
  });
  $("rShare").addEventListener("click", function(){
    var p=people[currentId]; if(!p) return;
    var txt=reportText(p);
    if(navigator.share){
      navigator.share({title:"Estado de cuenta de "+p.name, text:txt}).catch(function(e){
        if(e && e.name==="AbortError") return; copyText(txt);
      });
    } else { copyText(txt); }
  });
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ flash("Informe copiado. Pégalo en WhatsApp o correo."); },
        function(){ flash("No se pudo copiar el informe"); });
    } else { flash("No se pudo copiar el informe"); }
  }

  // ---------- PDF ----------
  var dlNs=null;
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(v){ dlNs=v; }).catch(function(){});
  }
  function pdfLib(){
    if(window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
    flash("No se pudo cargar el generador de PDF. Revisa tu conexión."); return null;
  }
  function safeName(s){ return String(s).replace(/[\\/:*?"<>|]/g,"").trim() || "persona"; }
  function openBlob(blob, filename){
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },60000);
  }
  function deliverPdf(doc, filename){
    var blob=doc.output("blob");
    if(dlNs){
      dlNs.save({filename:filename, data:blob}).then(function(){ flash("PDF guardado"); }, function(e){
        if(e && e.code==="declined") return; flash("No se pudo guardar el PDF");
      });
      return;
    }
    var file=null;
    try{ file=new File([blob], filename, {type:"application/pdf"}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:filename}).catch(function(e){
        if(e && e.name==="AbortError") return; openBlob(blob, filename);
      });
      return;
    }
    openBlob(blob, filename);
  }
  function pdfHeader(doc, title, sub, w){
    doc.setFillColor(29,43,100); doc.rect(0,0,w,30,"F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(17);
    doc.text(title,15,14);
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(sub,15,22);
    doc.setFontSize(9); doc.setTextColor(210,216,240);
    doc.text("Emitido el "+niceDate(today()), w-15, 22, {align:"right"});
  }
  function pdfReport(p){
    var J=pdfLib(); if(!J) return;
    var doc=new J({unit:"mm",format:"a4"}), t=totals(p);
    pdfHeader(doc,"Estado de cuenta",p.name,210);
    [["Total prestado",t.lent],["Total abonado",t.paid],["Saldo pendiente",t.bal]].forEach(function(b,i){
      var x=15+i*61;
      doc.setFillColor(238,241,251); doc.roundedRect(x,38,57,20,2,2,"F");
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(93,101,136); doc.text(b[0],x+4,45);
      doc.setFont("helvetica","bold"); doc.setFontSize(13);
      if(i===2) doc.setTextColor(192,57,43); else doc.setTextColor(26,31,54);
      doc.text(money(b[1]),x+4,53);
    });
    var run=0, body=[], kinds=[];
    t.ms.forEach(function(m){
      var isPay=m.type==="abono"; run+= isPay ? -m.amount : m.amount; kinds.push(isPay);
      body.push([niceDate(m.date), (isPay?"Abono":(m.first?"Préstamo inicial":"Préstamo"))+(m.note?"\n"+m.note:""),
        (isPay?"- ":"+ ")+money(m.amount), money(Math.max(run,0))]);
    });
    doc.autoTable({
      startY:66, head:[["Fecha","Detalle","Monto","Saldo"]], body:body, theme:"striped",
      margin:{left:15,right:15},
      styles:{font:"helvetica",fontSize:10,cellPadding:2.6,textColor:[26,31,54]},
      headStyles:{fillColor:[29,43,100],textColor:255},
      alternateRowStyles:{fillColor:[246,247,253]},
      columnStyles:{0:{cellWidth:32},2:{halign:"right",cellWidth:34},3:{halign:"right",cellWidth:34}},
      didParseCell:function(d){
        if(d.section==="body" && d.column.index===2){
          d.cell.styles.textColor = kinds[d.row.index] ? [31,122,77] : [192,57,43];
          d.cell.styles.fontStyle="bold";
        }
      }
    });
    var pays=t.ms.filter(function(m){ return m.type==="abono"; });
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(93,101,136);
    doc.text(pays.length
      ? pays.length+(pays.length===1?" abono registrado. Último abono el ":" abonos registrados. Último abono el ")+niceDate(pays[pays.length-1].date)+"."
      : "Aún no hay abonos registrados.", 15, doc.lastAutoTable.finalY+10);
    deliverPdf(doc, "Estado de cuenta - "+safeName(p.name)+".pdf");
  }
  function pdfReceipt(p, m){
    if(!p || !m) return;
    var J=pdfLib(); if(!J) return;
    var doc=new J({unit:"mm",format:"a5"}), W=148, isPay=m.type==="abono";
    var run=0, after=0;
    sortedMovs(p).forEach(function(x){ run+= x.type==="abono" ? -x.amount : x.amount; if(x.id===m.id) after=Math.max(run,0); });
    pdfHeader(doc, isPay ? "Comprobante de abono" : "Comprobante de préstamo", p.name, W);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(93,101,136);
    doc.text(isPay ? "Monto abonado" : "Monto prestado", 15, 44);
    doc.setFont("helvetica","bold"); doc.setFontSize(28);
    if(isPay) doc.setTextColor(31,122,77); else doc.setTextColor(192,57,43);
    doc.text(money(m.amount), 15, 57);
    var rows=[["Persona",p.name],["Fecha",niceDate(m.date)]];
    if(m.note) rows.push(["Nota",m.note]);
    rows.push(["Saldo después de este movimiento",money(after)]);
    rows.push(["Saldo pendiente a hoy",money(totals(p).bal)]);
    var y=70;
    rows.forEach(function(r){
      doc.setDrawColor(213,219,239); doc.line(15,y-5,W-15,y-5);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(93,101,136); doc.text(r[0],15,y);
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(26,31,54);
      var lines=doc.splitTextToSize(String(r[1]), W-30);
      doc.text(lines,15,y+6);
      y+=14+(lines.length-1)*5;
    });
    deliverPdf(doc, "Comprobante "+(isPay?"abono":"préstamo")+" - "+safeName(p.name)+" - "+m.date+".pdf");
  }

  // ---------- Formulario ----------
  var mode = null; // "nuevo" | "abono" | "prestamo"
  var editId = null;
  function openForm(m, movToEdit){
    if(!store){ flash("Espera un momento, cargando datos…"); return; }
    mode=m;
    var p=people[currentId];
    $("fTitle").textContent = m==="nuevo" ? "Nuevo préstamo" :
                              m==="abono" ? "Abono de "+p.name : "Prestar más a "+p.name;
    $("fNameWrap").style.display = m==="nuevo" ? "" : "none";
    $("fName").value=""; $("fAmount").value=""; $("fNoteIn").value="";
    $("fDate").value=today(); $("fErr").textContent="";
    $("fSave").textContent = m==="abono" ? "Guardar abono" : "Guardar préstamo";
    editId = null;
    if(movToEdit){
      editId = movToEdit.id;
      $("fTitle").textContent = (m==="abono" ? "Editar abono de " : "Editar préstamo a ")+p.name;
      $("fAmount").value = money(movToEdit.amount);
      $("fDate").value = movToEdit.date;
      $("fNoteIn").value = movToEdit.note || "";
      $("fSave").textContent = "Guardar cambios";
    }
    $("form").showModal();
    setTimeout(function(){ (m==="nuevo" ? $("fName") : $("fAmount")).focus(); },60);
  }
  $("fAmount").addEventListener("input", function(){
    var n=digits(this.value);
    this.value = n ? money(n) : "";
  });
  $("fSave").addEventListener("click", saveForm);
  $("form").addEventListener("keydown", function(e){ if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); saveForm(); } });

  function saveForm(){
    var amount=digits($("fAmount").value);
    var date=$("fDate").value || today();
    var note=$("fNoteIn").value.trim();
    var err=$("fErr");
    if(mode==="nuevo"){
      var name=$("fName").value.trim().replace(/\s+/g," ");
      if(!name){ err.textContent="Escribe el nombre de la persona."; $("fName").focus(); return; }
      if(!amount){ err.textContent="Escribe el monto prestado."; $("fAmount").focus(); return; }
      var existing=Object.keys(people).map(function(k){return people[k];})
        .filter(function(p){ return p.name.toLowerCase()===name.toLowerCase(); })[0];
      if(existing){
        var c=JSON.parse(JSON.stringify(existing));
        c.movs.push({id:uid(),type:"prestamo",amount:amount,date:date,note:note,ts:Date.now()});
        store.save(c); $("form").close(); flash("Sumado a la cuenta de "+existing.name); return;
      }
      var p={id:uid(),name:name,created:Date.now(),
             movs:[{id:uid(),type:"prestamo",amount:amount,date:date,note:note,ts:Date.now(),first:true}]};
      store.save(p); $("form").close(); flash("Préstamo guardado");
      return;
    }
    var cur=people[currentId]; if(!cur){ $("form").close(); return; }
    if(!amount){ err.textContent="Escribe el monto."; $("fAmount").focus(); return; }
    var copy=JSON.parse(JSON.stringify(cur));
    if(editId){
      copy.movs.forEach(function(m){ if(m.id===editId){ m.amount=amount; m.date=date; m.note=note; } });
    } else {
      copy.movs.push({id:uid(),type:mode,amount:amount,date:date,note:note,ts:Date.now()});
    }
    if(balance(copy)<0){
      err.textContent = editId ? "Con ese cambio los abonos superarían lo prestado."
                               : "El abono supera el saldo pendiente ("+money(balance(cur))+").";
      $("fAmount").focus(); return;
    }
    store.save(copy);
    $("form").close(); fillDetail();
    flash(editId ? "Cambios guardados" : mode==="abono" ? "Abono guardado" : "Préstamo guardado");
  }

  // ---------- Utilidades UI ----------
  document.querySelectorAll("[data-close]").forEach(function(b){
    b.addEventListener("click", function(){ b.closest("dialog").close(); });
  });
  document.querySelectorAll("dialog").forEach(function(d){
    d.addEventListener("click", function(e){ if(e.target===d) d.close(); });
  });
  $("newBtn").addEventListener("click", function(){ openForm("nuevo"); });

  var flashT;
  function flash(msg){
    var s=$("status"); s.textContent=msg; s.classList.add("show");
    clearTimeout(flashT); flashT=setTimeout(function(){ s.classList.remove("show"); },2200);
  }

  init();
})();
</script>
